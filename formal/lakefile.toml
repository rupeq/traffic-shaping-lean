name = "trafficShaping"
version = "0.1.0"
defaultTargets = ["TrafficShaping"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "TrafficShaping"
# Exact certificates reduce sequentially; cap each compiler's memory in MiB.
weakLeanArgs = ["-j1", "-M8192"]
