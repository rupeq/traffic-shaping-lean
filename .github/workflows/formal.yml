name: Check Lean formalization

on:
  push:
    paths:
      - 'formal/**'
      - 'verify_formal.py'
      - '.github/scripts/audit_formal.py'
      - '.github/workflows/formal.yml'
      - 'docs/TOOLCHAIN.md'
      - 'docs/CI.md'
  pull_request:
    paths:
      - 'formal/**'
      - 'verify_formal.py'
      - '.github/scripts/audit_formal.py'
      - '.github/workflows/formal.yml'
      - 'docs/TOOLCHAIN.md'
      - 'docs/CI.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify pinned Lean inputs
        working-directory: formal
        run: |
          test "$(tr -d '\r\n' < lean-toolchain)" = 'leanprover/lean4:v4.33.1'
          grep -Fq '"name": "mathlib"' lake-manifest.json
          grep -Fq '"rev": "0df444a360eaa60ab8c11dca51a86af692955474"' lake-manifest.json

      - name: Install the official Lean version manager
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned Lean and mathlib dependencies
        working-directory: formal
        run: |
          lean --version | grep -Fq 'Lean (version 4.33.1'
          lake exe cache get

      - name: Build and audit the complete formal source
        run: python3 verify_formal.py --output-dir .check-output/formal

      - name: Show build and kernel audit evidence
        if: always()
        run: |
          for report in .check-output/formal/full-optimum-build.log .check-output/formal/full-optimum-axioms.log .check-output/formal/full-optimum-audit.log; do
            if test -f "$report"; then
              cat "$report"
            fi
          done
