name: Reproduce exact certificates

on:
  push:
    paths:
      - 'computations/**'
      - '.github/workflows/computations.yml'
  pull_request:
    paths:
      - 'computations/**'
      - '.github/workflows/computations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source checksums
        working-directory: computations
        run: sha256sum --check SHA256SUMS
      - name: Install pinned solver dependencies
        run: python -m pip install -r computations/requirements.txt
      - name: Check saved witnesses and regenerate every positive-delay LP
        run: python computations/run_checks.py --outputdir .check-output/computations --full-regenerate
